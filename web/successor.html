<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mend FCO Successor</title><style>body{font:14px system-ui;margin:2rem;background:#08121d;color:#e8f0f7}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #345;padding:.5rem;text-align:left}code{font-size:11px}.state{font-weight:bold}</style></head><body><h1>Mend AIs FCO/FCG Successor</h1><p>Model evidence is probabilistic. The deterministic Mend policy gate controls release. Synthetic fixture only.</p><p>SOURCE → ATOM → REQUEST → ROUTE → EXECUTION → RESULT → VERIFICATION → RELEASE → BREAKPOINT</p><table><thead><tr><th>FCO</th><th>TYPE</th><th>STATE</th><th>HASH</th><th>PARENT</th><th>EXECUTOR</th><th>PROVIDER/MODEL</th><th>POLICY</th></tr></thead><tbody id="rows"></tbody></table><script>fetch('/api/fcos').then(r=>r.json()).then(({fcos})=>{for(const f of fcos){const tr=document.createElement('tr');for(const value of [f.fco_id.slice(0,16)+'…',f.fco_type,f.execution_state,f.content_sha256.slice(0,12)+'…',(f.parent_fco_ids||[]).map(x=>x.slice(0,10)+'…').join(', '),f.executor||'NULL',(f.provider||'NULL')+'/'+(f.model_id||'NULL'),f.policy_ref||'NULL']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}rows.appendChild(tr)}})</script></body></html>
